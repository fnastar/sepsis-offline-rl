name: Tests, research figures and synthetic demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.plot_results
      - run: python -m examples.synthetic_demo
